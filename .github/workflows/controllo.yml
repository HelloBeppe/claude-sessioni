name: controllo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Solo file ammessi, niente segreti
        shell: python3 {0}
        run: |
          import json, os, re, subprocess, sys
          AMMESSI = {"README.md", ".claude/settings.json", ".github/workflows/controllo.yml", ".github/CODEOWNERS"}
          file = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          errori = [f"file non ammesso: {f}" for f in file if f not in AMMESSI]
          SOSPETTI = [
              r"-----BEGIN", r"\bgh[pousr]_[A-Za-z0-9]{20,}", r"\bsk-[A-Za-z0-9_-]{16,}", r"\bAKIA[0-9A-Z]{16}",
              r"\bxox[abprs]-", r"\bAIza[0-9A-Za-z_-]{30,}", r"(?i)(password|passwd|secret|token|api[_-]?key|bearer)\s*[:=]",
              r"\b100\.\d{1,3}\.\d{1,3}\.\d{1,3}\b", r"\b(10|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}",
              r"(?i)\.ts\.net\b", r"/volume\d", r"[A-Za-z0-9+/]{40,}={0,2}",
          ]
          for f in file:
              if f == ".github/workflows/controllo.yml" or not os.path.isfile(f):
                  continue
              testo = open(f, encoding="utf-8", errors="replace").read()
              for n, riga in enumerate(testo.splitlines(), 1):
                  for s in SOSPETTI:
                      if re.search(s, riga):
                          errori.append(f"{f}:{n}: possibile segreto o indirizzo interno ({s})")
          p = ".claude/settings.json"
          if os.path.isfile(p):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception as e:
                  d = None
                  errori.append(f"{p}: JSON non valido: {e}")
              if d is not None:
                  if set(d) != {"permissions"} or not isinstance(d["permissions"], dict) or set(d["permissions"]) != {"allow"}:
                      errori.append(f"{p}: ammessa solo la chiave permissions.allow")
                  else:
                      for v in d["permissions"]["allow"]:
                          if not isinstance(v, str) or not re.fullmatch(r"mcp__[A-Za-z0-9_-]+(__[A-Za-z0-9_-]+)?", v):
                              errori.append(f"{p}: voce non ammessa: {v!r} (solo mcp__<connettore>[__<strumento>])")
          for e in errori:
              print("::error::" + e)
          print("controllo: " + ("FALLITO" if errori else "superato") + f", {len(file)} file")
          sys.exit(1 if errori else 0)
